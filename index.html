<!DOCTYPE html>
<html lang="en">
<!--Coordinate system is not standarized; passing lat and lng everywhere; going to fix later-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drone delivery</title>
  <script src="classes.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
</head>

<body>
  <h1>
    Keng's
  </h1>

  <div id="map" style="width: 100%; height: 500px"></div>
  <pre id="coords" class="coords"></pre>

  <div id="destination">
    <div>
      <br>
      <label for="lat">Longitude</label>
      <br>
      <input type="number" id="lat" name="latitude" value="-75.189" />
    </div>

    <div>
      <br>
      <label for="lon">Latitude</label>
      <br>
      <input type="number" id="lon" name="lon" value="40.686" />
    </div>

    <button id="submit" onclick="update_location()">change map coordinates</button>
  </div><br /><br />

  <div id="mission_selection">
    <button id="go_to_location" onclick="send_coord_data()">go to location</button>
  </div>

  <script>
    var lat = document.getElementById("lat").value;
    var lon = document.getElementById("lon").value;
    var coordinates = new Module.Coordinates();
    var pilot = new Module.Pilot();

    const coords = document.getElementById("coords");

    coords.innerHTML =
      `Longitude: ${coordinates.get_longitude()}<br/>Latitude: ${coordinates.get_latitude()}`;

    var map = new maplibregl.Map({
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [lat, lon],
      zoom: 9.5,
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap Contributors',
            maxzoom: 19
          },

          terrainSource: {
            type: 'raster-dem',
            url: 'https://tiles.mapterhorn.com/tilejson.json'
          },
          hillshadeSource: {
            type: 'raster-dem',
            url: 'https://tiles.mapterhorn.com/tilejson.json'
          }
        },
        layers: [
          {
            id: 'osm',
            type: 'raster',
            source: 'osm'
          },
          {
            id: 'hills',
            type: 'hillshade',
            source: 'hillshadeSource',
            layout: {visibility: 'visible'},
            paint: {'hillshade-shadow-color': '#473B24'}
          }
        ],
        terrain: {
          source: 'terrainSource',
          exaggeration: 1
        },
        sky: {}
      },
    })

    map.addControl(
      new maplibregl.NavigationControl({
        visualizePitch: true,
        showZoom: true,
        showCompass: true
      })
    );

    map.addControl(
      new maplibregl.TerrainControl({
        source: 'terrainSource',
        exaggeration: 1
      })
    );

    let marker = new maplibregl.Marker({draggable: true})
      .setLngLat([lat, lon])
      .addTo(map);
    // Coords flipped somewhere
    function onDragEnd() {
      lng_lat = marker.getLngLat();
      coordinates.set_destination(lng_lat.lat, lng_lat.lng);
      coords.style.display = 'block';
      coords.innerHTML =
        `Longitude: ${coordinates.get_longitude()}<br/>Latitude: ${coordinates.get_latitude()}`;
    }

    marker.on('dragend', onDragEnd);

    function update_location() {
      lat = document.getElementById("lat").valueAsNumber;
      lng = document.getElementById("lon").valueAsNumber;

      coordinates.set_destination(lat, lng);
      coords.style.display = 'block';
      coords.innerHTML =
        `Latitude: ${coordinates.get_longitude()}<br/>Latitude: ${coordinates.get_latitude()}`;


      map.setCenter = ([coordinates.get_latitude(), coordinates.get_longitude()]);
      window.location.reload();
      console.log("latitude- ", lat);
      console.log("longitude-", lon);
    }

    function start_go_to_location() {
      pilot.go_to_location(coordinates.get_latitude(), coordinates.get_longitude());
    }

    async function send_coord_data() {
      // Endpoint requesting from
      const url = "http://127.0.0.1:3000/api/deliver_payload";

      const coords_json = {
        latitude: coordinates.get_latitude(),
        longitude: coordinates.get_longitude()
      };

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(coords_json)
        });

        const result = await response.json();
        console.log("Backend response:", result);
      } catch (error) {
        console.error("Transmission failed:", error);
      }
    }

    // Backend request
    async function get_data() {

      // Endpoint requesting from
      const url = "http://127.0.0.1:3000/api/deliver_payload";
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Response status: ${response.status}`);
        }

        const result = await response.json();
        console.log(result);
      } catch (error) {
        console.error(error.message);
      }
    }

  </script>

</body>

</html>
